name: VICEHUB social publishing scheduler

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vicehub-social-publisher
  cancel-in-progress: false

jobs:
  publish-due-posts:
    name: Process due social posts
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call the protected VICEHUB publisher
        env:
          CRON_SECRET: ${{ secrets.SOCIAL_PUBLISHER_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::SOCIAL_PUBLISHER_CRON_SECRET is not configured in GitHub Actions. Skipping safely."
            exit 0
          fi

          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 5 --retry-connrefused --max-time 50 \
            -X POST "https://gta6-creator-hub-c26cc578.base44.app/api/social/publisher/cron" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{}'
