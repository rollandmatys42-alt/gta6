name: VICEHUB source checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/vicehub-video-library-overhaul]

jobs:
  frontend-syntax:
    name: Frontend and server-function syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse changed JSX and JavaScript
        run: |
          npx --yes esbuild src/routes/index.jsx src/routes/_authed/dashboard.jsx src/routes/library.jsx src/routes/social.jsx src/routes/admin.jsx src/routes/admin/shop.jsx src/routes/api/social/publisher.jsx src/routes/api/social/publisher/cron.jsx src/routes/api/news/sources/cron.jsx src/routes/api/agents/growth/cron.jsx src/routes/_authed/admin/videos.jsx 'src/routes/news/$slug.jsx' src/routes/news-sitemap[.]xml.jsx src/routes/articles-sitemap[.]xml.jsx src/routes/api/agents/growth/cron.jsx src/routes/shop.jsx src/routes/admin-digital-products.jsx src/routes/api/stripe/webhook.jsx src/lib/server-fns.js src/lib/storage-fns.js src/lib/digital-shop-fns.js src/lib/i18n.js src/lib/video-cleaner.js src/lib/video-download.js src/routes/api/video/preview/\$videoId.jsx src/routes/api/video/download/\$videoId.jsx src/routes/_authed/admin/video-library.jsx src/routes/_authed/admin/operations.jsx src/routes/_authed/admin/affiliates.jsx src/routeTree.gen.ts src/lib/admin-ops-fns.js src/lib/affiliate-fns.js 'src/routes/api/internal-video-assets/$assetId.jsx' src/routes/api/internal-video-jobs/claim.jsx 'src/routes/api/internal-video-jobs/$jobId.jsx' src/routes/api/internal-video-job-source.jsx src/routes/api/internal-video-job-upload.jsx src/lib/internal-video-fns.js src/lib/google-drive-api.js src/lib/digital-shop-security.js 'src/routes/api/shop/digital-download/$productId.jsx' --bundle --external:* --outdir=/tmp/vicehub-syntax-check --log-level=warning

  video-worker-syntax:
    name: Python video worker syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile worker source
        run: python -m compileall -q workers/video-engine
