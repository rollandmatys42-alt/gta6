name: Validate TanStack source syntax
on:
  pull_request:
    branches:
      - main
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save @babel/parser
      - name: Parse every JS and JSX source file
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const { parse } = require('@babel/parser');
          const files = cp.execSync('git ls-files', {encoding:'utf8'}).trim().split('\n').filter(p => /^src\/.*\.(jsx|js|tsx|ts)$/.test(p));
          let failed = false;
          for (const file of files) {
            try {
              parse(fs.readFileSync(file,'utf8'), {sourceType:'module', sourceFilename:file, plugins:['jsx','typescript','decorators-legacy','importAttributes']});
            } catch (e) {
              failed = true;
              console.error(file + ':' + (e.loc?.line||1) + ':' + (e.loc?.column||1) + ' ' + e.message);
            }
          }
          console.log('Parsed ' + files.length + ' source files.');
          if (failed) process.exit(1);
          NODE
