name: Validate TanStack source syntax
on:
  push:
    branches:
      - ci/validate-tanstack-syntax
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save typescript
      - name: Parse every JS and JSX source file
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const ts = require('typescript');
          const files = cp.execSync('git ls-files', {encoding:'utf8'}).trim().split('\n').filter(p => /^src\/.*\.(jsx|js|tsx|ts)$/.test(p));
          let failed = false;
          for (const file of files) {
            const kind = /\.tsx?$/.test(file) ? ts.ScriptKind.TSX : file.endsWith('.jsx') ? ts.ScriptKind.JSX : ts.ScriptKind.JS;
            const source = ts.createSourceFile(file, fs.readFileSync(file,'utf8'), ts.ScriptTarget.Latest, true, kind);
            for (const d of source.parseDiagnostics) {
              failed = true;
              const pos = source.getLineAndCharacterOfPosition(d.start || 0);
              console.error(file + ':' + (pos.line+1) + ':' + (pos.character+1) + ' ' + ts.flattenDiagnosticMessageText(d.messageText,' '));
            }
          }
          console.log('Parsed ' + files.length + ' source files.');
          if (failed) process.exit(1);
          NODE
