name: VICEHUB daily SEO GEO growth orchestration

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vicehub-growth-orchestrator
  cancel-in-progress: false

jobs:
  run-growth-agents:
    name: Run SEO, GEO and growth chief-of-staff agents
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the protected VICEHUB growth scheduler
        env:
          CRON_SECRET: ${{ secrets.GTA_NEWS_SYNC_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::GTA_NEWS_SYNC_CRON_SECRET is not configured in GitHub Actions. Growth agents were not run."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --retry 2 --retry-delay 5 --max-time 120 \
            -X POST "https://gta6-creator-hub-c26cc578.base44.app/api/agents/growth/cron" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{}'
